      <h1>Python Programlama</h1>
      <p>Python, Google’dan NASA’ya kadar her yerde kullanılan, dünyanın en yaygın programlama dillerinden biri. Aynı zamanda okunabilirliği sayesinde öğrenmesi en kolay dil. Bu kurs, blok tabanlı kodlamadan gerçek metin tabanlı programlamaya geçişi mümkün olan en yumuşak şekilde yapar: her hafta çalışan bir program çıkar, hiçbir hafta teoriyle geçmez.</p>
      <h2>Öne çıkanlar</h2><ul><li>Yaş aralığı: 11–15 Yaş · Seviye: Orta</li><li>Süre: 8 hafta, 16 canlı ders (haftada 2 ders × 60 dakika)</li><li>Sınıf: en fazla 8 öğrenci</li><li>Başlangıç fiyatı: 8.900 TL</li><li>Ön koşul: Klavyeyi rahat kullanabilmek yeterli. Scratch deneyimi avantaj sağlar ama şart değildir.</li><li>Kullanılan araçlar: Python 3, Visual Studio Code, Thonny (ilk haftalar), Turtle grafik kütüphanesi</li><li>1. hafta — Metin Tabanlı Kodlamaya Geçiş: Python nedir, nerede kullanılır; Geliştirme ortamının kurulumu; print() ile ekrana yazdırma, yorum satırları; İlk hata mesajları ve nasıl okunur. Çıktı: Kendini tanıtan, biçimlendirilmiş çıktı veren ilk program</li><li>2. hafta — Değişkenler ve Veri Tipleri: Sayılar, metinler, mantıksal değerler; input() ile kullanıcıdan veri alma; Tip dönüşümleri ve sık yapılan hatalar; Matematiksel operatörler ve öncelik sırası. Çıktı: Kullanıcıdan veri alan bilimsel hesap makinesi</li><li>3. hafta — Koşullar ve Karar Yapıları: if / elif / else yapısı; Karşılaştırma ve mantıksal operatörler; İç içe koşullar; Girinti (indentation) kuralı ve önemi. Çıktı: İpucu veren sayı tahmin oyunu</li><li>4. hafta — Döngüler: for döngüsü ve range(); while döngüsü ve sonsuz döngü tehlikesi; break ve continue; Döngüyle desen ve tablo üretme. Çıktı: Çarpım tablosu üreteci ve basit şifre deneme programı</li><li>5. hafta — Listeler ve Sözlükler: Liste oluşturma, ekleme, silme, sıralama; İndeksleme ve dilimleme; Sözlükler: anahtar–değer mantığı; Veri yapısında döngüyle gezinme. Çıktı: Kelime ve anlamlarını tutan sözlük uygulaması</li><li>6. hafta — Fonksiyonlar ve Modüler Kod: def ile fonksiyon tanımlama; Parametre ve return değeri; Kod tekrarından kurtulma; random, time ve math modülleri. Çıktı: Fonksiyonlara bölünmüş zar oyunu ve istatistik hesabı</li><li>7. hafta — Dosya İşlemleri ve Hata Yönetimi: Dosya okuma ve yazma; try / except ile hata yakalama; Program kapansa bile kaybolmayan veri; Kullanıcı hatalarına karşı programı sağlamlaştırma. Çıktı: Skorları kalıcı olarak kaydeden oyun</li><li>8. hafta — Bitirme Projesi ve Demo Günü: Proje fikrini seçme ve planlama; Turtle ile grafik veya konsol uygulaması geliştirme; Kod düzenleme ve yorum ekleme; Projeyi sunma ve savunma. Çıktı: Kendi seçtiğin konuda çalışan Python uygulaması</li><li>Bitirme projesi: Öğrenci; hesaplama aracı, metin tabanlı oyun veya Turtle ile grafik uygulama seçeneklerinden birini seçip baştan sona geliştirir. Kodun tamamını satır satır açıklayarak Demo Günü’nde sunar.</li></ul>
