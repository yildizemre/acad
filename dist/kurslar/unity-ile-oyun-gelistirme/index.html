      <h1>Unity ile Oyun Geliştirme</h1>
      <p>Unity, dünyadaki mobil oyunların yarısından fazlasının yapıldığı profesyonel oyun motoru. Bu kurs bir simülasyon değil: öğrenci sektörde kullanılan aracın aynısını, sektörde kullanılan dilin (C#) aynısını kullanır. 10 hafta sonunda oyunu itch.io üzerinde yayınlanır ve herkes tarayıcıdan oynayabilir.</p>
      <h2>Öne çıkanlar</h2><ul><li>Yaş aralığı: 13–17 Yaş · Seviye: İleri</li><li>Süre: 10 hafta, 20 canlı ders (haftada 2 ders × 75 dakika)</li><li>Sınıf: en fazla 6 öğrenci</li><li>Başlangıç fiyatı: 10.900 TL</li><li>Ön koşul: Temel programlama deneyimi gerekir. Python veya Web kursunu tamamlamış olmak ideal; en azından değişken, döngü ve fonksiyon kavramlarını bilmek şart.</li><li>Kullanılan araçlar: Unity 6, C#, Visual Studio, Blender (temel), Git, itch.io</li><li>1. hafta — Unity Arayüzü ve 3B Dünya: Unity kurulumu ve proje oluşturma; Sahne, Hierarchy, Inspector panelleri; GameObject ve Component mantığı; Transform: konum, dönüş, ölçek. Çıktı: Nesnelerle dolu, gezilebilir ilk 3B sahne</li><li>2. hafta — C# Programlama Temelleri: MonoBehaviour ve script yaşam döngüsü; Start() ve Update() metotları; Değişkenler, metotlar, sınıflar; Inspector'dan değer düzenleme. Çıktı: Kod ile dönen ve hareket eden nesneler</li><li>3. hafta — Fizik ve Karakter Hareketi: Rigidbody ve kütle, sürtünme; Collider ve çarpışma algılama; Kullanıcı girdisiyle karakter kontrolü; Zıplama ve yerçekimi ayarları. Çıktı: Zıplayabilen, çarpışan karakter kontrolcüsü</li><li>4. hafta — 2B Oyun Mekanikleri: Sprite ve 2B fizik; Animator ile karakter animasyonu; Platform, tuzak ve toplanabilir nesneler; Tilemap ile seviye çizme. Çıktı: Oynanabilir 2B platform oyunu bölümü</li><li>5. hafta — Arayüz, Menü ve Skor Sistemi: Canvas ve UI elemanları; Butonlar ve sahne geçişleri; Skor, can ve süre göstergeleri; Oyun bitti ve duraklat ekranları. Çıktı: Menüsü ve skor tablosu olan tam oyun akışı</li><li>6. hafta — Ses, Efekt ve Parçacık Sistemleri: AudioSource ile müzik ve efekt; Particle System: patlama, ateş, toz; Işıklandırma ve gölge; Post-processing ile görsel kalite. Çıktı: Görsel ve işitsel olarak zenginleştirilmiş sahne</li><li>7. hafta — Yapay Zeka Düşmanlar: NavMesh ile yol bulma; Düşman durum makineleri (devriye, takip, saldırı); Görüş alanı ve algılama; Zorluk dengeleme. Çıktı: Oyuncuyu takip eden ve saldıran akıllı düşmanlar</li><li>8. hafta — Seviye Tasarımı ve Oyun Dengesi: Öğrenme eğrisi ve zorluk artışı; Ödül döngüsü tasarımı; Prefab ile tekrar kullanılabilir içerik; Oyun testçileriyle test etme. Çıktı: Zorluğu kademeli artan çok bölümlü oyun</li><li>9. hafta — Optimizasyon ve Build Alma: Performans profilleme; Doku ve model optimizasyonu; WebGL, Windows ve Android için build; itch.io üzerinde yayınlama. Çıktı: Tarayıcıda oynanabilen, yayınlanmış oyun</li><li>10. hafta — Bitirme Projesi ve Demo Günü: Kendi oyun fikrinin tasarım belgesi; Geliştirme, test ve düzeltme döngüsü; Oyun tanıtım sayfası hazırlama; Canlı sunum ve oynatma. Çıktı: Yayında olan, herkesin oynayabildiği kendi oyunun</li><li>Bitirme projesi: Öğrenci kendi oyun fikrini tasarım belgesiyle planlar, geliştirir, test ettirir ve itch.io üzerinde yayınlar. Demo Günü’nde oyunu canlı oynatarak tasarım kararlarını anlatır.</li></ul>
