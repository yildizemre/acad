    <noscript><div id="seo-icerik">
      <h1>Yapay Zeka &amp; Makine Öğrenmesi</h1>
      <p>Bugün herkes yapay zeka kullanıyor; çok azı nasıl çalıştığını biliyor. Bu kurs o farkı kapatıyor. Öğrenci kendi veri setini toplar, temizler, görselleştirir, model eğitir ve modelin neden yanıldığını analiz eder. Kurucu ekibimizin bilgisayarla görü ve derin öğrenme alanındaki sanayi deneyimi doğrudan bu müfredata yansıyor.</p>
      <h2>Öne çıkanlar</h2><ul><li>Yaş aralığı: 14–17 Yaş · Seviye: İleri</li><li>Süre: 8 hafta, 16 canlı ders (haftada 2 ders × 75 dakika)</li><li>Sınıf: en fazla 6 öğrenci</li><li>Başlangıç fiyatı: 8.900 TL</li><li>Ön koşul: Python bilgisi zorunludur. Python Programlama kursunu tamamlamış olmak veya döngü, fonksiyon ve liste kavramlarına hâkim olmak gerekir.</li><li>Kullanılan araçlar: Python 3, Google Colab, NumPy &amp; Pandas, Matplotlib, scikit-learn, OpenCV, Teachable Machine</li><li>1. hafta — Yapay Zeka Nedir, Nerede Kullanılır: Yapay zeka, makine öğrenmesi ve derin öğrenme farkı; Günlük hayattaki yapay zeka örnekleri; Yapay zeka etiği, önyargı ve veri gizliliği; Google Colab ortamıyla tanışma. Çıktı: Teachable Machine ile eğitilmiş ilk görüntü sınıflandırıcı</li><li>2. hafta — Veriyle Düşünmek: NumPy dizileri ve vektör işlemleri; Pandas ile tablo okuma ve filtreleme; Eksik ve hatalı veriyi temizleme; Veri setleri nereden bulunur. Çıktı: Gerçek bir veri setini temizleyip analize hazır hâle getirme</li><li>3. hafta — Veri Görselleştirme: Matplotlib ile çizgi, sütun, dağılım grafikleri; Grafikten anlam çıkarma; Korelasyon ve nedensellik farkı; Yanıltıcı grafikleri tanıma. Çıktı: Seçtiğin konuda veri analizi raporu ve grafikleri</li><li>4. hafta — İlk Makine Öğrenmesi Modeli: Denetimli öğrenme mantığı; Eğitim ve test verisi ayrımı; Sınıflandırma: karar ağacı ve k-NN; scikit-learn ile model eğitme. Çıktı: Tahmin yapan, eğitilmiş ilk sınıflandırma modelin</li><li>5. hafta — Model Değerlendirme: Doğruluk, kesinlik, duyarlılık; Karışıklık matrisi okuma; Aşırı öğrenme (overfitting) ve önlemleri; Modeli iyileştirme döngüsü. Çıktı: Modelin nerede ve neden yanıldığını gösteren analiz</li><li>6. hafta — Bilgisayarla Görü: Görüntü nasıl sayıya dönüşür (piksel, kanal); OpenCV ile görüntü işleme filtreleri; Yüz ve nesne algılama; Kameradan gerçek zamanlı işleme. Çıktı: Kameradan yüz algılayan çalışan uygulama</li><li>7. hafta — Sinir Ağları ve Üretken Yapay Zeka: Yapay sinir ağı nasıl öğrenir; Katman, ağırlık ve aktivasyon kavramları; Büyük dil modelleri nasıl çalışır; Etkili istem (prompt) yazma ve sınırları. Çıktı: Sinir ağıyla eğitilmiş el yazısı rakam tanıyıcı</li><li>8. hafta — Bitirme Projesi ve Demo Günü: Kendi problem ve veri setini seçme; Model eğitme ve iyileştirme; Sonuçları görselleştirme; Bulguları sunma ve savunma. Çıktı: Kendi verinle eğittiğin, sonuçlarını sunduğun model</li><li>Bitirme projesi: Öğrenci kendi ilgi alanından bir problem seçer (spor istatistiği, müzik türü, bitki tanıma vb.), veri setini bulur veya oluşturur, modeli eğitir ve sonuçları grafiklerle sunar. Modelin sınırlarını ve etik boyutunu da tartışır.</li></ul>
