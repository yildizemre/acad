[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Yönlendirme ──────────────────────────────────────────────────────────────
# Derleme sırasında her rota için ayrı bir index.html üretiliyor
# (scripts/prerender.mjs). Netlify önce bu statik dosyalara bakar, bulamazsa
# aşağıdaki kurala düşer.
#
# ⚠️  Bu kurala "force = true" EKLEMEYİN. Eklenirse statik sayfalar atlanır,
#     arama motorları her adreste aynı boş index.html'i görür ve ön işlemenin
#     bütün faydası kaybolur.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Önbellek ─────────────────────────────────────────────────────────────────
# Hash'li varlıklar sonsuza kadar önbelleklenebilir; HTML asla.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── Güvenlik başlıkları ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # SSL: Netlify alan adı bağlandığında Let's Encrypt sertifikasını otomatik
    # kurar ve HTTP'yi HTTPS'e yönlendirir (Domain management → HTTPS →
    # "Force HTTPS" açık olmalı). Aşağıdaki başlık tarayıcıya bir yıl boyunca
    # yalnızca HTTPS kullanmasını söyler.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ─── Notlar ───────────────────────────────────────────────────────────────────
# ─── Form bildirimleri ────────────────────────────────────────────────────────
# Deneme dersi formu gönderimleri şu adrese düşmeli:
#
#     emre.yildiz@hypevisionlab.com
#
# Netlify bu ayarı yalnızca panelden kabul ediyor, dosyadan yapılamıyor:
#   Netlify Dashboard → Site configuration → Forms → Form notifications
#   → Add notification → Email notification
#   Event: New form submission   ·   Form: deneme-dersi
#   Email to notify: emre.yildiz@hypevisionlab.com
#
# İlk deploy'dan sonra siteden bir test formu gönderip panelde
# Forms → deneme-dersi altında göründüğünü doğrulayın.
#
# Ortam değişkenleri (analitik, takvim, ödeme):
#   Site configuration → Environment variables — bkz. .env.example
