# Yerel Supabase yığını — Hype Academia paneli
project_id = "hype-academia-panel"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Yerelde giden postaları yakalar; gerçek mail gitmez.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5174"]
jwt_expiry = 3600

# ⚠️ Kayıt açık: admin panelden kullanıcı oluşturabilsin diye.
#    Bu, panelin adresini bilen birinin kendi kendine hesap açabilmesi demek.
#    CANLIDA KAPATILMALI ve kullanıcı oluşturma, service_role ile çalışan bir
#    Edge Function'a taşınmalı. (Yapılacaklar listesinde.)
enable_signup = true

[auth.email]
enabled = true                 # e-posta + şifre ile giriş
enable_signup = true
double_confirm_changes = false
enable_confirmations = false   # yerelde e-posta doğrulaması bekleme
