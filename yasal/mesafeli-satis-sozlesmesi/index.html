      <h1>Mesafeli Satış Sözleşmesi</h1>
      <p>Bu sözleşme, 6502 sayılı Tüketicinin Korunması Hakkında Kanun ve Mesafeli Sözleşmeler Yönetmeliği uyarınca, internet üzerinden verilen eğitim hizmetinin satışına ilişkin tarafların hak ve yükümlülüklerini düzenler.</p>
      <h2>Öne çıkanlar</h2><ul><li>MADDE 1 — Taraflar — SATICI</li><li>Ünvan: Hype Vision</li><li>Marka: Hype Academia (Hype Vision bünyesinde faaliyet gösteren teknoloji eğitimi markası)</li><li>Telefon: +90 541 862 91 90</li><li>E-posta: info@hypevisionlab.com</li><li>İnternet Sitesi: https://hypeacademia.com</li><li>MADDE 2 — Taraflar — ALICI</li><li>Sipariş formunda ad, soyad, telefon, e-posta ve fatura bilgilerini beyan eden kişidir. Hizmetten yararlanacak öğrenci 18 yaşından küçükse, sözleşmenin tarafı velisi veya yasal temsilcisidir.</li><li>MADDE 3 — Sözleşmenin Konusu</li><li>İşbu sözleşmenin konusu, ALICI’nın https://hypeacademia.com adresinden elektronik ortamda siparişini verdiği, nitelikleri ve satış bedeli aşağıda belirtilen eğitim hizmetinin satışı ve ifasıdır.</li><li>MADDE 4 — Hizmetin Temel Nitelikleri</li><li>Hizmet türü: Dijital ortamda sunulan canlı eğitim hizmeti</li><li>İfa yöntemi: Zoom veya Google Meet üzerinden canlı çevrimiçi ders</li><li>Süre, ders sayısı, ders süresi ve sınıf mevcudu: ilgili kurs sayfasında ve sipariş özetinde belirtilir.</li><li>Hizmet bedeli: sipariş özetinde KDV dahil olarak gösterilir.</li><li>Geçerlilik: Fiyatlar, sipariş anında sitede ilan edilen tutarlardır.</li><li>MADDE 5 — Hizmetin İfası</li><li>Ders takvimi, ödeme onayından sonra ALICI ile birlikte belirlenir.</li><li>Dersler ilan edilen gün ve saatlerde canlı olarak yapılır; her ders kaydedilir.</li><li>SATICI’dan kaynaklanan iptallerde ders telafi edilir veya bedeli iade edilir.</li><li>ALICI kaynaklı devamsızlıklarda dönem başına iki telafi hakkı tanınır; talebin dersten en az 24 saat önce iletilmesi gerekir.</li><li>Eğitmen değişikliği hâlinde en az eşdeğer nitelikte bir eğitmen görevlendirilir ve ALICI bilgilendirilir.</li><li>MADDE 6 — Ödeme</li><li>Ödeme, kredi kartı veya banka kartı ile tek çekim ya da taksitli olarak yapılır.</li><li>Taksit sayısı ve taksit tutarları sipariş onayından önce gösterilir; taksitlerin toplamı gösterilen toplam tutara eşittir.</li><li>Kart bilgileri SATICI tarafından görülmez ve saklanmaz.</li><li>Ödemenin bankaca onaylanmaması hâlinde SATICI’nın ifa yükümlülüğü doğmaz.</li><li>Ödemeler iyzi Ödeme ve Elektronik Para Hizmetleri A.Ş. altyapısı üzerinden 3D Secure doğrulamasıyla alınır.</li><li>MADDE 7 — Cayma Hakkı</li><li>ALICI, hizmetin ifasına başlanmadan önce on dört (14) gün içinde gerekçe göstermeksizin cayma hakkına sahiptir. Cayma bildirimi yazılı olarak iletilir ve bedel en geç 14 gün içinde iade edilir.</li><li>SATICI, yasal 14 günlük süreye ek olarak, ilk iki ders tamamlanana kadar koşulsuz iade hakkı tanır. Bu hak, işletme politikası gereği ALICI lehine tanınmış olup yasal cayma hakkını sınırlamaz.</li><li>MADDE 8 — Cayma Hakkının Kullanılamayacağı Hâller</li><li>Mesafeli Sözleşmeler Yönetmeliği madde 15 uyarınca, ALICI’nın onayı ile ifasına başlanan hizmetlerde cayma hakkı kullanılamaz. Ambalajı açılmış donanım setleri de bu kapsamdadır.</li><li>MADDE 9 — Kişisel Verilerin Korunması</li><li>Taraflar, 6698 sayılı Kişisel Verilerin Korunması Kanunu’na uygun davranmayı kabul eder. Verilerin işlenmesine ilişkin ayrıntılar Gizlilik Politikası ve KVKK Aydınlatma Metni’nde yer alır. 18 yaş altı öğrencilere ait veriler yalnızca veli onayıyla işlenir.</li><li>MADDE 10 — Mücbir Sebep</li><li>Doğal afet, salgın, altyapı kesintisi gibi tarafların kontrolü dışındaki durumlarda yükümlülükler askıya alınır. Süre otuz (30) günü aşarsa taraflar sözleşmeyi feshedebilir; bu hâlde ifa edilmemiş kısmın bedeli iade edilir.</li><li>MADDE 11 — Delil Sözleşmesi ve Yetkili Mahkeme</li><li>Taraflar arasındaki uyuşmazlıklarda SATICI’nın elektronik kayıtları delil teşkil eder. Ticaret Bakanlığı’nca ilan edilen parasal sınırlar dâhilinde Tüketici Hakem Heyetleri, aşan kısımda Tüketici Mahkemeleri yetkilidir.</li><li>MADDE 12 — Yürürlük</li><li>ALICI, siteden sipariş vermekle işbu sözleşmenin tüm koşullarını okuduğunu, anladığını ve kabul ettiğini beyan eder. Sözleşme, sipariş onayı ile yürürlüğe girer ve bir örneği ALICI’nın e-posta adresine gönderilir.</li></ul>
