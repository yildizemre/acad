      <h1>Ön Bilgilendirme Formu</h1>
      <p>Bu form, siparişinizi onaylamadan önce hizmetin nitelikleri, bedeli, ödeme ve cayma hakkınız konusunda sizi bilgilendirmek üzere Mesafeli Sözleşmeler Yönetmeliği uyarınca hazırlanmıştır.</p>
      <h2>Öne çıkanlar</h2><ul><li>MADDE 1 — Satıcı Bilgileri</li><li>Ünvan: Hype Vision</li><li>Marka: Hype Academia (Hype Vision bünyesinde faaliyet gösteren teknoloji eğitimi markası)</li><li>Telefon: +90 541 862 91 90</li><li>E-posta: info@hypevisionlab.com</li><li>İnternet Sitesi: https://hypeacademia.com</li><li>MADDE 2 — Hizmetin Niteliği</li><li>Sözleşmeye konu hizmet, Dijital ortamda sunulan canlı eğitim hizmeti'dir. Dersler Zoom veya Google Meet üzerinden canlı çevrimiçi ders olarak işlenir. Hizmet fiziksel bir ürün teslimi içermez; tek istisna Arduino &amp; Robotik kursunda donanım seti kargo ile gönderilir.</li><li>Her kursun süresi, ders sayısı, ders süresi, sınıf mevcudu ve haftalık müfredatı ilgili kurs sayfasında yazılıdır.</li><li>Dersler canlı yapılır, kaydedilir ve öğrenci panelinde 12 ay süreyle erişilebilir kalır.</li><li>Kurs sonunda öğrenciye tamamlama sertifikası düzenlenir.</li><li>MADDE 3 — Bedel ve Ödeme</li><li>Hizmet bedeli, seçilen kurs ve pakete göre değişir ve sipariş özetinde KDV dahil olarak gösterilir.</li><li>Sipariş onayından önce toplam tutar, varsa taksit sayısı ve taksit tutarları ayrı ayrı gösterilir.</li><li>Ödeme, kredi kartı veya banka kartı ile alınır.</li><li>Peşin ödemede indirim, taksitli ödemede vade farkı uygulanabilir; her ikisi de sipariş özetinde açıkça belirtilir.</li><li>Ödeme işlemi iyzico (iyzi Ödeme ve Elektronik Para Hizmetleri A.Ş.) altyapısı üzerinden 3D Secure ile gerçekleştirilir. Kart bilgileriniz Hype Vision sunucularında saklanmaz; ödeme iyzico’nun 3D Secure altyapısı üzerinden alınır.</li><li>MADDE 4 — Cayma Hakkı</li><li>ALICI, hizmetin ifasına başlanmadan önce herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin on dört (14) gün içinde cayma hakkına sahiptir.</li><li>Cayma bildirimi, aşağıdaki iletişim kanallarından yazılı olarak yapılır.</li><li>Cayma hakkının kullanılması hâlinde ödenen bedel, bildirimin ulaşmasından itibaren en geç on dört (14) gün içinde iade edilir.</li><li>SATICI, işletme politikası gereği yasal 14 günlük süreden bağımsız olarak ilk iki ders tamamlanana kadar koşulsuz iade hakkı tanır. Bu, ALICI lehine ek bir haktır.</li><li>MADDE 5 — Cayma Hakkının İstisnası</li><li>Mesafeli Sözleşmeler Yönetmeliği madde 15/1-(h) uyarınca, ALICI’nın onayı ile ifasına başlanan hizmetlerde cayma hakkı kullanılamaz. Bununla birlikte SATICI, ilk iki ders tamamlanana kadar koşulsuz iade uygulamasını sürdürür.</li><li>Arduino &amp; Robotik kursunda gönderilen donanım seti fiziksel üründür; ambalajı açılmamış ve kullanılmamış olması hâlinde iadesi mümkündür.</li><li>MADDE 6 — Şikâyet ve İtiraz</li><li>ALICI, uyuşmazlık hâlinde Ticaret Bakanlığı’nca her yıl belirlenen parasal sınırlar dâhilinde, hizmeti satın aldığı veya ikametgâhının bulunduğu yerdeki Tüketici Hakem Heyetine veya Tüketici Mahkemesine başvurabilir.</li></ul>
